<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spin Your Chill Day!!</title>
  
  <style>
    body {
      text-align: center;
      background-color: rgba(255, 255, 160, 0.929);
      font-family: cursive;
      margin: 0;
      padding: 40px 20px;
       background-image: linear-gradient(rgba(255,255,255,0.6), rgba(255,255,255,0.6)), url('img/header.jpe');
      background-repeat: no-repeat;
      background-size: 100% 300px;
      background-position: top center;
    
    }
    .image-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 25px;
    }
    .image-container img {
      width: 500px;
      height: 300px;
      object-fit: cover;
      border-radius: 20px;
      box-shadow: 0 8px 1px rgba(0, 0, 0, 0.15);
      border: 2px solid rgb(156, 100, 100);
    }
    h1 {
      font-family: cursive;
      font-size: 2.5rem;
      font-weight: bold;
      color: #a97777;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 1.5rem;
      color: #5e5e59; 
      margin-top: 0;
    }

    p {
      font-size: 1.1rem;
      color: hsl(40, 10%, 30%);
    }
    .btn-link {
      text-decoration: none;
      display: inline-block;
      margin-top: 15px;
    }
    .start-btn {
      background-color: #ff9a9e;
      color: white;
      font-family: cursive;
      font-size: 18px;
      font-weight: bold;
      padding: 14px 32px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255, 154, 158, 0.4);
      transition: all 0.3s ease;
    }
    .start-btn:hover {
      background-color: #ff758f;
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(255, 117, 143, 0.5);
    }
  </style>
</head>
<body>
   <div class="image-container">
    <img src="img/our team!!.jpeg">
  </div>
   <h1>WELCOME TO OUR WEB!! :)</h1>
  <h2>Ready for a perfect day? ^^</h2>
  <p>Spin the wheel and discover your perfect chill activity for today! No rush, just good vibes!</p>
  <a href="spin.html" class="btn-link">
    <button class="start-btn">start here!</button>
  </a>

</body>
</html>
